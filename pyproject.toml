[project]
name = "doceval"
version = "0.1.0"
description = "Deterministic OOXML corpus probe for document-parsing evaluation (docx/pptx)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
doceval = "doceval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doceval"]
